# cPanel Git Version Control deployment.
#
# Set DEPLOYPATH below to the document root of the domain this site serves:
#   Primary domain ...  $HOME/public_html
#   Addon domain .....  $HOME/kavo.mv            (see cPanel > Domains)
#   Subdomain ........  $HOME/public_html/sub
#
# README.md, .claude/ and the repository itself are deliberately not copied.
---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH/assets/photos
    - /bin/mkdir -p $DEPLOYPATH/css
    - /bin/mkdir -p $DEPLOYPATH/js
    - /bin/cp -f index.html $DEPLOYPATH/
    - /bin/cp -f import-export.html $DEPLOYPATH/
    - /bin/cp -f construction.html $DEPLOYPATH/
    - /bin/cp -f real-estate.html $DEPLOYPATH/
    - /bin/cp -f about.html $DEPLOYPATH/
    - /bin/cp -f contact.html $DEPLOYPATH/
    - /bin/cp -Rf assets/. $DEPLOYPATH/assets/
    - /bin/cp -f css/kavo.css $DEPLOYPATH/css/
    - /bin/cp -f js/kavo.js $DEPLOYPATH/js/
    - /bin/cp -f deploy/.htaccess $DEPLOYPATH/
